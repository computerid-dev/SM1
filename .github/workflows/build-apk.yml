name: Build APK

# Workflow ini hanya melakukan satu hal: membungkus web app Study Mate
# (folder www/) menjadi satu berkas APK yang bisa diinstal di Android,
# memakai Capacitor sebagai library pembungkusnya.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install library Capacitor (pembungkus APK)
        run: npm install

      - name: Tambahkan platform Android
        run: npx cap add android

      - name: Terapkan ikon & splash screen ke Android
        run: npx capacitor-assets generate --android

      - name: Sinkronkan aset web ke proyek Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: studymate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
